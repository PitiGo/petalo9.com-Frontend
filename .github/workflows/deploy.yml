name: Deploy Frontend (Blue/Green)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          tar -czf /tmp/deploy.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            --exclude=build \
            --exclude='*.icloud' \
            -C . .
          mv /tmp/deploy.tar.gz deploy.tar.gz

      - name: Copy files to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          source: deploy.tar.gz
          target: /opt/petalo9-frontend

      - name: Execute Blue/Green Deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/petalo9-frontend

            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            BLUE_CONTAINER="petalo9-frontend-blue"
            GREEN_CONTAINER="petalo9-frontend-green"
            COMPOSE_FILE="docker-compose-blue-green.yml"

            if docker ps --format '{{.Names}}' | grep -q "^${BLUE_CONTAINER}$"; then
              ACTIVE="blue"
              INACTIVE="green"
              TARGET_PORT="3005"
            elif docker ps --format '{{.Names}}' | grep -q "^${GREEN_CONTAINER}$"; then
              ACTIVE="green"
              INACTIVE="blue"
              TARGET_PORT="3004"
            else
              ACTIVE="none"
              INACTIVE="blue"
              TARGET_PORT="3004"
            fi

            SERVICE="petalo9-frontend-${INACTIVE}"
            CONTAINER="petalo9-frontend-${INACTIVE}"
            IMAGE="petalo9-frontend_${SERVICE}"

            echo "Activo: ${ACTIVE} | Desplegando en: ${INACTIVE} (puerto ${TARGET_PORT})"

            # Limpiar contenedores viejos (evita KeyError ContainerConfig en docker-compose 1.29)
            docker stop "${BLUE_CONTAINER}" "${GREEN_CONTAINER}" 2>/dev/null || true
            docker rm -f "${BLUE_CONTAINER}" "${GREEN_CONTAINER}" 2>/dev/null || true
            docker ps -a --filter "name=petalo9-frontend" -q | xargs -r docker rm -f 2>/dev/null || true

            echo "Construyendo imagen Docker..."
            docker-compose -f "${COMPOSE_FILE}" build --no-cache "${SERVICE}"

            IMAGE_ID="$(docker images -q "${IMAGE}" | head -1)"
            if [ -z "${IMAGE_ID}" ]; then
              echo "No se encontro la imagen ${IMAGE}"
              docker images
              exit 1
            fi

            # Extraer build sin docker-compose up (mas fiable que recreate)
            echo "Extrayendo build de Vite desde la imagen..."
            TMP_CID="$(docker create "${IMAGE_ID}")"
            mkdir -p build
            rm -rf build/*
            rm -rf static 2>/dev/null || true
            docker cp "${TMP_CID}:/usr/src/app/build/." ./build/
            docker rm "${TMP_CID}"

            if ! grep -q '/assets/' build/index.html; then
              echo "ERROR: build/index.html no es un build de Vite"
              head -20 build/index.html || true
              exit 1
            fi
            echo "Build de Vite verificado (index.html referencia /assets/)"

            # Levantar contenedor inactivo con docker run (evita bug de compose up)
            echo "Iniciando contenedor ${CONTAINER}..."
            docker run -d \
              --name "${CONTAINER}" \
              -p "${TARGET_PORT}:3000" \
              -e REACT_APP_API_URL=https://api.dantecollazzi.com \
              --restart unless-stopped \
              "${IMAGE_ID}"

            echo "Recargando Nginx..."
            systemctl reload nginx

            if [ "${ACTIVE}" != "none" ]; then
              OLD_CONTAINER="petalo9-frontend-${ACTIVE}"
              echo "Deteniendo contenedor anterior (${OLD_CONTAINER})..."
              docker stop "${OLD_CONTAINER}" 2>/dev/null || true
              docker rm -f "${OLD_CONTAINER}" 2>/dev/null || true
            fi

            echo "Despliegue completado en ${INACTIVE}."
