name: Deploy Frontend (Blue/Green)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Empaquetar solo lo necesario para el build Docker (exclude no es válido
      # en appleboy/scp-action; sin esto se intenta subir todo el workspace).
      - name: Create deployment package
        run: |
          tar -czf deploy.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            --exclude=build \
            --exclude='*.icloud' \
            -C . .

      - name: Copy files to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          source: deploy.tar.gz
          target: /opt/petalo9-frontend

      - name: Execute Blue/Green Deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            cd /opt/petalo9-frontend

            # Extraer el paquete de despliegue (preserva ./build/ para nginx hasta el swap)
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            # Definir nombres
            BLUE_CONTAINER="petalo9-frontend-blue"
            GREEN_CONTAINER="petalo9-frontend-green"

            # 1. Detectar contenedor activo
            if docker ps --format '{{.Names}}' | grep -q "^$BLUE_CONTAINER$"; then
              ACTIVE="blue"
              INACTIVE="green"
              TARGET_PORT="3005"
            elif docker ps --format '{{.Names}}' | grep -q "^$GREEN_CONTAINER$"; then
              ACTIVE="green"
              INACTIVE="blue"
              TARGET_PORT="3004"
            else
              ACTIVE="none"
              INACTIVE="blue"
              TARGET_PORT="3004"
            fi

            echo "Activo: $ACTIVE | Desplegando en: $INACTIVE (Puerto $TARGET_PORT)"

            # 2. Levantar el contenedor inactivo (nuevo codigo)
            docker-compose -f docker-compose-blue-green.yml build --no-cache petalo9-frontend-$INACTIVE
            docker-compose -f docker-compose-blue-green.yml up -d petalo9-frontend-$INACTIVE

            # 3. Esperar a que arranque
            echo "Esperando a que el contenedor inicie..."
            sleep 10

            # 4. Copiar el build generado al directorio que sirve Nginx
            echo "Actualizando archivos estaticos..."
            mkdir -p build
            rm -rf build/*
            docker cp petalo9-frontend-$INACTIVE:/usr/src/app/build/. ./build/

            # 5. Recargar Nginx
            echo "Recargando Nginx..."
            systemctl reload nginx

            # 6. Detener el contenedor viejo
            if [ "$ACTIVE" != "none" ]; then
              echo "Deteniendo contenedor anterior ($ACTIVE)..."
              docker stop petalo9-frontend-$ACTIVE || true
              docker rm petalo9-frontend-$ACTIVE || true
            fi

            echo "Despliegue completado en $INACTIVE."
