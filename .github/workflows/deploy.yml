name: Deploy Frontend (Blue/Green)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          tar -czf /tmp/deploy.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            --exclude=build \
            --exclude='*.icloud' \
            -C . .
          mv /tmp/deploy.tar.gz deploy.tar.gz

      - name: Copy files to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          source: deploy.tar.gz
          target: /opt/petalo9-frontend

      - name: Execute Blue/Green Deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/petalo9-frontend

            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            BLUE_CONTAINER="petalo9-frontend-blue"
            GREEN_CONTAINER="petalo9-frontend-green"
            COMPOSE_FILE="docker-compose-blue-green.yml"

            if docker ps --format '{{.Names}}' | grep -q "^${BLUE_CONTAINER}$"; then
              ACTIVE="blue"
              INACTIVE="green"
              TARGET_PORT="3005"
            elif docker ps --format '{{.Names}}' | grep -q "^${GREEN_CONTAINER}$"; then
              ACTIVE="green"
              INACTIVE="blue"
              TARGET_PORT="3004"
            else
              ACTIVE="none"
              INACTIVE="blue"
              TARGET_PORT="3004"
            fi

            SERVICE="petalo9-frontend-${INACTIVE}"
            CONTAINER="petalo9-frontend-${INACTIVE}"
            IMAGE="petalo9-frontend_${SERVICE}"

            echo "Activo: ${ACTIVE} | Desplegando en: ${INACTIVE} (puerto ${TARGET_PORT})"

            # Limpiar contenedores viejos (evita KeyError ContainerConfig en docker-compose 1.29)
            docker stop "${BLUE_CONTAINER}" "${GREEN_CONTAINER}" 2>/dev/null || true
            docker rm -f "${BLUE_CONTAINER}" "${GREEN_CONTAINER}" 2>/dev/null || true
            docker ps -a --filter "name=petalo9-frontend" -q | xargs -r docker rm -f 2>/dev/null || true

            echo "Construyendo imagen Docker..."
            docker-compose -f "${COMPOSE_FILE}" build --no-cache "${SERVICE}"

            IMAGE_ID="$(docker images -q "${IMAGE}" | head -1)"
            if [ -z "${IMAGE_ID}" ]; then
              echo "No se encontro la imagen ${IMAGE}"
              docker images
              exit 1
            fi

            # Extraer build sin docker-compose up (mas fiable que recreate)
            echo "Extrayendo build de Vite desde la imagen..."
            TMP_CID="$(docker create "${IMAGE_ID}")"
            mkdir -p build
            rm -rf build/*
            rm -rf static 2>/dev/null || true
            docker cp "${TMP_CID}:/usr/src/app/build/." ./build/
            docker rm "${TMP_CID}"

            # Shims CRA: bundles cacheados piden /static/media/<hash>.webp
            echo "Creando shims CRA en build/static/media..."
            mkdir -p build/static/media
            cp build/images/developer-illustration.webp build/static/media/developer-illustration.5e85ae9a863c51258f9c.webp
            cp build/images/snake-3d.webp build/static/media/snake-3d.1f31ed237d0d3126094b.webp
            cp build/images/hand-invaders-preview.webp build/static/media/hand-invaders-preview.f15ca3227766ce80077d.webp
            cp build/images/supermarcos.webp build/static/media/supermarcos.9b678f9f1e0aa63eeb02.webp
            cp build/images/guess-country.webp build/static/media/guess-country.0596661b0241c3584da5.webp
            cp build/images/mamvsreptiles.webp build/static/media/mamvsreptiles.f72e3f7b8f0e549dacfa.webp

            if ! grep -q '/assets/' build/index.html; then
              echo "ERROR: build/index.html no es un build de Vite"
              head -20 build/index.html || true
              exit 1
            fi
            echo "Build de Vite verificado (index.html referencia /assets/)"

            # Manifest de despliegue (debug)
            echo "{\"build\":\"vite\",\"deployedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > build/version.json

            # Instalar snippet nginx para migracion CRA -> Vite
            NGINX_SNIPPET="/etc/nginx/snippets/petalo9-frontend.conf"
            if [ -w /etc/nginx/snippets ] || command -v sudo >/dev/null 2>&1; then
              SUDO=""
              [ "$(id -u)" -ne 0 ] && SUDO="sudo"
              $SUDO cp deploy/nginx-petalo9-frontend.conf "${NGINX_SNIPPET}" 2>/dev/null || true
              SITE_CFG="$($SUDO grep -rl 'dantecollazzi' /etc/nginx/sites-enabled/ 2>/dev/null | head -1 || true)"
              if [ -n "${SITE_CFG}" ] && ! $SUDO grep -q 'petalo9-frontend.conf' "${SITE_CFG}" 2>/dev/null; then
                echo "Anadiendo include nginx para migracion CRA..."
                $SUDO sed -i '/server_name.*dantecollazzi/a \    include /etc/nginx/snippets/petalo9-frontend.conf;' "${SITE_CFG}"
              fi
            fi

            # Levantar contenedor inactivo con docker run (evita bug de compose up)
            echo "Iniciando contenedor ${CONTAINER}..."
            docker run -d \
              --name "${CONTAINER}" \
              -p "${TARGET_PORT}:3000" \
              -e REACT_APP_API_URL=https://api.dantecollazzi.com \
              --restart unless-stopped \
              "${IMAGE_ID}"

            echo "Recargando Nginx..."
            if command -v sudo >/dev/null 2>&1 && [ "$(id -u)" -ne 0 ]; then
              sudo nginx -t && sudo systemctl reload nginx
            else
              nginx -t && systemctl reload nginx
            fi

            echo "index.html servido:"
            grep -oE 'src="[^"]+"' build/index.html | head -3 || true

            if [ "${ACTIVE}" != "none" ]; then
              OLD_CONTAINER="petalo9-frontend-${ACTIVE}"
              echo "Deteniendo contenedor anterior (${OLD_CONTAINER})..."
              docker stop "${OLD_CONTAINER}" 2>/dev/null || true
              docker rm -f "${OLD_CONTAINER}" 2>/dev/null || true
            fi

            echo "Despliegue completado en ${INACTIVE}."
