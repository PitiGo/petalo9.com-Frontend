# Snippet para incluir dentro del server {} de dantecollazzi.com
# Fuerza a clientes con index.html cacheado (CRA) a recargar y obtener el build de Vite.

location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    add_header Pragma "no-cache";
    expires 0;
}

# Bundles legacy de CRA: devolver un script que fuerza recarga completa
location ~ ^/static/js/(main\.[a-f0-9]+\.js|[0-9]+\.[a-f0-9]+\.chunk\.js)$ {
    default_type application/javascript;
    add_header Cache-Control "no-store";
    return 200 "window.location.replace(location.origin + '/?_vite=' + Date.now());";
}
